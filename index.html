<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>梦遇 - 手机预览</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #f5efe6 0%, #ebe1d2 50%, #e6d8c5 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 36px;
      font-weight: 700;
      color: #d97706;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 16px;
      color: #666666;
    }

    .phone-container {
      position: relative;
      background: #1a1a1a;
      border-radius: 50px;
      padding: 12px;
      box-shadow: 
        0 0 0 3px #333,
        0 0 0 6px #222,
        0 20px 60px rgba(0, 0, 0, 0.5);
      width: 375px;
      max-width: 100%;
    }

    .phone-bezel {
      background: #0d0d0d;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
    }

    .camera-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: #0d0d0d;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .camera {
      width: 8px;
      height: 8px;
      background: #1a1a2e;
      border-radius: 50%;
      border: 1px solid #333;
    }

    .camera.large {
      width: 12px;
      height: 12px;
    }

    .speaker {
      width: 40px;
      height: 3px;
      background: #222;
      border-radius: 2px;
    }

    .screen {
      width: 100%;
      height: 812px;
      background: #0f0f1a;
      border-radius: 42px;
      overflow: hidden;
      position: relative;
    }

    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 130px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      z-index: 10;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
    }

    .status-bar-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .signal-icon, .wifi-icon, .battery-icon {
      width: 18px;
      height: 12px;
    }

    .signal-icon {
      background: linear-gradient(to right, 
        white 2px, transparent 2px),
        linear-gradient(to right, 
        white 2px, transparent 2px),
        linear-gradient(to right, 
        white 2px, transparent 2px),
        linear-gradient(to right, 
        white 2px, transparent 2px);
      background-size: 2px 4px, 2px 6px, 2px 8px, 2px 10px;
      background-repeat: no-repeat;
      background-position: 0 8px, 5px 6px, 10px 4px, 15px 2px;
    }

    .wifi-icon {
      background: white;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      width: 14px;
      height: 14px;
    }

    .battery-icon {
      width: 24px;
      height: 11px;
      border: 1.5px solid white;
      border-radius: 3px;
      position: relative;
      background: rgba(255, 255, 255, 0.2);
    }

    .battery-icon::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 5px;
      background: white;
      border-radius: 0 1px 1px 0;
    }

    .battery-level {
      position: absolute;
      left: 1px;
      top: 1px;
      bottom: 1px;
      width: 70%;
      background: #4ade80;
      border-radius: 2px;
    }

    .controls {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }

    .control-btn {
      padding: 12px 24px;
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      color: #333333;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .control-btn:hover {
      background: #e5e5e5;
      border-color: #d97706;
    }

    .control-btn.active {
      background: rgba(217, 119, 6, 0.1);
      border-color: #d97706;
      color: #d97706;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: #999999;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .phone-container {
        width: 100%;
        border-radius: 30px;
        padding: 8px;
      }

      .phone-bezel {
        border-radius: 26px;
      }

      .screen {
        height: 650px;
        border-radius: 26px;
      }

      .camera-notch {
        width: 90px;
        height: 24px;
      }

      .header h1 {
        font-size: 24px;
      }

      .header p {
        font-size: 14px;
      }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>梦遇</h1>
    <p>每个人的人生，都是别人的一个梦</p>
  </div>

  <div class="phone-container">
    <div class="phone-bezel">
      <div class="camera-notch">
        <div class="camera"></div>
        <div class="speaker"></div>
        <div class="camera large"></div>
      </div>

      <div class="screen">
        <div class="status-bar">
          <div class="status-bar-left">
            <span>9:41</span>
          </div>
          <div class="status-bar-right">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon">
              <div class="battery-level"></div>
            </div>
          </div>
        </div>

        <iframe src="/app.html" title="梦遇"></iframe>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" onclick="location.href='/app.html'">全屏模式</button>
    <button class="control-btn" onclick="reloadApp()">刷新应用</button>
    <button class="control-btn" onclick="switchTheme()">切换背景</button>
  </div>

  <div class="footer">
    梦遇 - 匿名情绪社区平台
  </div>

  <script>
    function reloadApp() {
      const iframe = document.querySelector('iframe');
      if (iframe) {
        iframe.src = iframe.src;
      }
    }

    function switchTheme() {
      const buttons = document.querySelectorAll('.control-btn');
      buttons.forEach(btn => btn.classList.toggle('active'));
      
      const body = document.body;
      if (body.style.background) {
        body.style.background = '';
      } else {
        body.style.background = 'linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%)';
      }
    }

    setInterval(() => {
      const timeEl = document.querySelector('.status-bar-left span');
      if (timeEl) {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeEl.textContent = `${hours}:${minutes}`;
      }
    }, 1000);
  </script>
</body>
</html>
